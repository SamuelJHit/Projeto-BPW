<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank</title>
    <link rel="stylesheet" href="cc.css">
    <link rel="javasheet" href="config.js">
</head>
<body>
    <div>
        <header class="container-head">
            <div class="box">
                <h3>Bank</h3>
            </div>
        </header>
    </div>

    <main class="main-content">
        <section class="boxLogin">
            <div class="input-group">
                <label>Cadastro Cliente:</label>
                <input type="Nome" id="inputnome" placeholder="Digite seu nome:">
                <input type="CPF"  id="inputcpf" placeholder="Digite seu CPF:">
                <input type="Nascimentodamae" id="inputnascimentodamae" placeholder="Digite o nascimento da sua mãe:">
                <input type="Email" id="inputemail" placeholder="Digite seu email:">
                <input type="Telefone" id="inputtelefone" placeholder="Digite o numero do seu telefone:">
                
            </div>
            <button class="buttonII" onclick="cadastrar()"> Entrar</button>
        </section>
    </main>

    <footer>
        <div class="container-rodape">
            <div class="copyright">
                <p>&copy; 2026 Todos os direitos reservados por Jacó, Ruan e Samuel</p>
            </div>
        </div>
    </footer>
</body>
</html>
